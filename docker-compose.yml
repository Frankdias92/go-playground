version: '3.9'

services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT=root
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mysql-db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  mysql_data:
  pg_data: